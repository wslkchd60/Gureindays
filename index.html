<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pop-up Guerlain, 4 jours</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2a2219;
  --ink-dim:rgba(42,34,25,.62);
  --glass:rgba(255,251,244,.62);
  --line:rgba(150,112,52,.22);
  --gold:#b98a3e;
  --serif:"Cormorant Garamond", "Cormorant", Georgia, "Times New Roman", serif;
  --sans:"Jost", "Futura", system-ui, -apple-system, "Segoe UI", sans-serif;
  --ease-out:cubic-bezier(.23,1,.32,1);
}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:#efe9df;color:var(--ink);font-family:var(--sans)}
canvas#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
body.walk canvas#scene{cursor:crosshair}
body.dragging canvas#scene{cursor:grabbing}
.panel{background:var(--glass);border:1px solid var(--line);
  backdrop-filter:blur(16px) saturate(150%);-webkit-backdrop-filter:blur(16px) saturate(150%);
  box-shadow:0 6px 24px rgba(60,40,10,.10)}

.brand{position:fixed;top:max(16px,env(safe-area-inset-top));left:16px;display:flex;flex-direction:column;gap:3px;
  padding:10px 16px 11px;border-radius:14px;pointer-events:none}
.brand .mark{font-family:var(--serif);font-weight:600;font-size:1.25rem;letter-spacing:.3em}
.brand .sub{font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim);
  transition:opacity 260ms var(--ease-out),filter 260ms var(--ease-out)}
.brand .sub.swap{opacity:0;filter:blur(3px)}

.tools{position:fixed;top:max(16px,env(safe-area-inset-top));right:16px;display:flex;gap:8px}
.tools button{height:40px;border-radius:999px;color:var(--ink);cursor:pointer;display:grid;place-items:center;
  font:500 .75rem/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;
  transition:transform 160ms var(--ease-out),background-color 200ms var(--ease-out)}
.tools button:active{transform:scale(.96)}
#mode{padding:0 16px;display:flex;gap:8px;align-items:center}
#mode svg,#fs svg{width:16px;height:16px}
#fs{width:40px}

.dock{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);
  display:flex;flex-direction:column;align-items:center;gap:10px;width:max-content;max-width:calc(100vw - 24px);pointer-events:none}
.hint{font-size:.8125rem;color:var(--ink);text-align:center;padding:7px 14px;border-radius:999px;
  transition:opacity 420ms var(--ease-out),filter 420ms var(--ease-out),transform 420ms var(--ease-out)}
.hint.off{opacity:0;filter:blur(4px);transform:translateY(4px)}
.days{pointer-events:auto;position:relative;display:grid;grid-template-columns:repeat(4,1fr);padding:4px;border-radius:18px}
.days .pill{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px) / 4);border-radius:14px;
  background:linear-gradient(180deg,#f6e2b4,#cfa35a);
  box-shadow:0 2px 12px rgba(185,138,62,.35);transition:transform 320ms var(--ease-out)}
.days button{position:relative;z-index:1;appearance:none;border:0;background:none;cursor:pointer;color:var(--ink);
  padding:9px 16px 10px;min-width:132px;border-radius:14px;display:flex;flex-direction:column;align-items:center;gap:3px;
  transition:transform 160ms var(--ease-out)}
.days button:active{transform:scale(.97)}
.days b{font:600 1rem/1 var(--serif);letter-spacing:.12em;text-transform:uppercase}
.days small{font-size:.75rem;color:var(--ink-dim);white-space:nowrap}
.days button[aria-selected="true"] small{color:rgba(42,30,10,.8)}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.dip{position:fixed;inset:0;pointer-events:none;background:rgba(250,245,236,.0);
  backdrop-filter:blur(0px);-webkit-backdrop-filter:blur(0px);
  transition:background-color 260ms var(--ease-out),backdrop-filter 260ms var(--ease-out),-webkit-backdrop-filter 260ms var(--ease-out)}
.dip.on{background:rgba(250,245,236,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}

.veil{position:fixed;inset:0;display:grid;place-content:center;justify-items:center;gap:10px;background:#efe9df;z-index:5;
  transition:opacity 900ms var(--ease-out),filter 900ms var(--ease-out)}
.veil span{font-family:var(--serif);font-weight:600;font-size:2rem;letter-spacing:.4em;padding-left:.4em}
.veil small{font-size:.75rem;letter-spacing:.24em;text-transform:uppercase;color:var(--ink-dim)}
.veil.gone{opacity:0;filter:blur(6px);pointer-events:none}

@media (max-width:640px){
  .brand{padding:8px 12px}.brand .mark{font-size:1rem}.brand .sub{font-size:.75rem;letter-spacing:.06em}
  #mode .lbl{display:none}#mode{width:40px;padding:0;justify-content:center;gap:0}
  .days button{min-width:0;padding:10px 12px}
  .days small{display:none}
}
@media (prefers-reduced-motion: reduce){
  .hint,.days .pill,.days button,.tools button,.veil,.dip,.brand .sub{transition:none}
  .hint.off{transform:none;filter:none}
}
</style>
</head>
<body>
<canvas id="scene" aria-label="Stand Guerlain en 3D dans un centre commercial" tabindex="0"></canvas>
<div class="brand panel"><span class="mark">GUERLAIN</span><span class="sub" id="sub">Jour 1 · Conseil &amp; soin</span></div>
<div class="tools">
  <button class="panel" id="mode" aria-label="Passer en visite"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="8" cy="3" r="1.6"/><path d="M8 5.5v4.5M8 10l-2.5 4.5M8 10l2.5 4.5M4.5 7.5h7"/></svg><span class="lbl">Visite</span></button>
  <button class="panel" id="fs" aria-label="Plein écran"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M1.5 5.5v-4h4M10.5 1.5h4v4M14.5 10.5v4h-4M5.5 14.5h-4v-4"/></svg></button>
</div>
<div class="dock">
  <p class="hint panel" id="hint">Glisser pour tourner autour · molette pour approcher</p>
  <div class="days panel" id="days" role="tablist" aria-label="Jour du pop-up">
    <span class="pill" aria-hidden="true"></span>
    <button role="tab" aria-selected="true" data-day="0"><b>Jour 1</b><small>Conseil &amp; soin</small></button>
    <button role="tab" aria-selected="false" data-day="1"><b>Jour 2</b><small>Création &amp; R&amp;D</small></button>
    <button role="tab" aria-selected="false" data-day="2"><b>Jour 3</b><small>Production &amp; artisanat</small></button>
    <button role="tab" aria-selected="false" data-day="3"><b>Jour 4</b><small>Formation &amp; job dating</small></button>
  </div>
</div>
<div class="dip" id="dip"></div>
<div class="veil" id="veil"><span>GUERLAIN</span><small>Le pop-up, jour après jour</small></div>
